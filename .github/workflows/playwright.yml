name: Module 2 — Playwright + Auto-fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  module2:
    name: Module 2 — locator tests
    # Pinned: Playwright 1.59 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Run Module 2 tests
        id: tests
        # Explicit config: playwright.config.ts (the qa/ suite) would otherwise
        # win and its testDir excludes tests/, giving "No tests found".
        run: npx playwright test tests/module2.spec.js --config playwright.config.js --reporter=list,json
        continue-on-error: true

      # Auto-fix agent (lesson 2.3.5) — one attempt, then escalate.
      - name: Auto-fix agent
        if: steps.tests.outcome == 'failure'
        run: node scripts/autofix-pipeline.js failure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL:       ${{ secrets.JIRA_EMAIL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          LINEAR_API_KEY:   ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:   ${{ secrets.LINEAR_TEAM_ID }}
          # No Linear secrets on this repo (e.g. a fresh template copy)? Run the
          # tracker step in mock mode instead of failing the startup check.
          LINEAR_MOCK:      ${{ secrets.LINEAR_API_KEY == '' && 'true' || 'false' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module2-results
          path: test-results/
          retention-days: 7
